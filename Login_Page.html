<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Hotel Transylvania | LogIn</title>
    <!-- Google Fonts & simple reset for elegance -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <!-- Font Awesome 6 (free icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(145deg, #e9f0fc 0%, #d9e4f5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
        }

        /* subtle animated background circles (decor) */
        body::before {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(99,102,241,0.08) 0%, rgba(99,102,241,0) 70%);
            top: 10%;
            left: -100px;
            border-radius: 50%;
            z-index: 0;
        }

        body::after {
            content: "";
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(56,189,248,0.08) 0%, rgba(56,189,248,0) 70%);
            bottom: 0;
            right: -120px;
            border-radius: 50%;
            z-index: 0;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(0px);
            border-radius: 2rem;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.25), 0 8px 18px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 460px;
            padding: 2.2rem 2rem 2.5rem 2rem;
            transition: transform 0.2s ease;
            z-index: 2;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .login-card:hover {
            transform: translateY(-2px);
        }

        .brand {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-icon {
            background: linear-gradient(135deg, #3886b6, #31e2e2);
            width: 64px;
            height: 64px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 28px;
            box-shadow: 0 12px 18px -8px rgba(79, 70, 229, 0.4);
            margin-bottom: 1rem;
        }

        .brand-icon i {
            font-size: 2.2rem;
            color: rgb(72, 68, 68);
        }

        .brand h1 {
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #1e293b, #2d3a5e);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .brand p {
            color: #5b6e8c;
            font-size: 0.9rem;
            margin-top: 6px;
            font-weight: 500;
        }

        /* input group styling */
        .input-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .input-group i.icon-left {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 1.1rem;
            transition: color 0.2s;
            pointer-events: none;
        }

        .input-group input {
            width: 100%;
            padding: 0.9rem 1rem 0.9rem 2.7rem;
            font-size: 1rem;
            font-weight: 500;
            border: 1.5px solid #e2e8f0;
            border-radius: 1.2rem;
            background: #ffffff;
            transition: all 0.25s ease;
            font-family: 'Inter', sans-serif;
            color: #0f172a;
            outline: none;
        }

        .input-group input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.2);
        }

        .input-group input::placeholder {
            color: #a0afc3;
            font-weight: 400;
        }

        /* password toggle button */
        .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
            padding: 0;
        }

        .toggle-password:hover {
            color: #4f46e5;
        }

        /* extra row (remember + forgot) */
        .flex-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.8rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            font-size: 0.85rem;
            color: #334155;
            font-weight: 500;
        }

        .checkbox-label input {
            width: 1rem;
            height: 1rem;
            cursor: pointer;
            accent-color: #4f46e5;
        }

        .forgot-link {
            font-size: 0.85rem;
            font-weight: 600;
            color: #4f46e5;
            text-decoration: none;
            transition: color 0.2s;
        }

        .forgot-link:hover {
            color: #312e81;
            text-decoration: underline;
        }

        /* login button */
        .login-btn {
            background: linear-gradient(105deg, #4f46e5 0%, #6366f1 100%);
            width: 100%;
            border: none;
            padding: 0.9rem;
            border-radius: 2rem;
            font-weight: 700;
            font-size: 1rem;
            color: white;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 8px 16px -6px rgba(79, 70, 229, 0.3);
            margin-bottom: 1.5rem;
        }

        .login-btn i {
            font-size: 1rem;
            transition: transform 0.2s;
        }

        .login-btn:hover {
            background: linear-gradient(105deg, #4338ca 0%, #4f46e5 100%);
            transform: scale(0.98);
            box-shadow: 0 4px 12px -4px rgba(79, 70, 229, 0.5);
        }

        .login-btn:active {
            transform: scale(0.97);
        }

        .signup-prompt {
            text-align: center;
            font-size: 0.85rem;
            color: #475569;
            margin-top: 0.5rem;
        }

        .signup-prompt a {
            color: #123051;
            font-weight: 700;
            text-decoration: none;
        }

        .signup-prompt a:hover {
            text-decoration: underline;
        }

        /* message area (error/success) */
        .message-area {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.8rem;
            font-weight: 500;
            min-height: 2.5rem;
            padding: 0.3rem;
            border-radius: 1rem;
            transition: all 0.2s;
        }

        .error-msg {
            color: #dc2626;
            background: #fef2f2;
            padding: 0.5rem;
            border-radius: 2rem;
        }

        .success-msg {
            color: #059669;
            background: #ecfdf5;
            padding: 0.5rem;
            border-radius: 2rem;
        }

        /* responsiveness */
        @media (max-width: 500px) {
            .login-card {
                padding: 1.8rem 1.5rem;
            }
            .brand h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="brand">
        <div class="brand-icon">
            <!-- ICON CHANGED FROM LOCK TO HOUSE per user request -->
            <i class="fas fa-house-chimney"></i>
        </div>
        <h1>Hotel Transylvania</h1>
        <p>Sign in to get a good experience</p>
    </div>

    <!-- login form -->
    <form id="loginForm" action="#" method="POST">
        <!-- email / username field -->
        <div class="input-group">
            <i class="fas fa-envelope icon-left"></i>
            <input type="email" id="emailInput" name="email" placeholder="Email address" autocomplete="email" required>
        </div>

        <!-- password field with toggle -->
        <div class="input-group">
            <i class="fas fa-key icon-left"></i>
            <input type="password" id="passwordInput" name="password" placeholder="Password" autocomplete="current-password" required>
            <button type="button" class="toggle-password" id="togglePasswordBtn" aria-label="Toggle password visibility">
                <i class="far fa-eye-slash" id="toggleIcon"></i>
            </button>
        </div>

        <!-- remember & forgot -->
        <div class="flex-row">
            <label class="checkbox-label">
                <input type="checkbox" id="rememberCheckbox"> Remember me
            </label>
            <a href="#" class="forgot-link" id="forgotPasswordLink">Forgot password?</a>
        </div>

        <!-- login button -->
        <button type="submit" class="login-btn" id="loginButton">
            <i class="fas fa-arrow-right-to-bracket"></i> Sign In
        </button>

        <div class="signup-prompt">
            Don't have an account? <a href="#" id="signupLink">Create account</a>
        </div>

        <!-- dynamic message area (for feedback) -->
        <div id="formMessage" class="message-area"></div>
    </form>
</div>

<script>
    (function() {
        // DOM elements
        const emailInput = document.getElementById('emailInput');
        const passwordInput = document.getElementById('passwordInput');
        const loginForm = document.getElementById('loginForm');
        const messageBox = document.getElementById('formMessage');
        const toggleBtn = document.getElementById('togglePasswordBtn');
        const toggleIcon = document.getElementById('toggleIcon');
        const rememberCheck = document.getElementById('rememberCheckbox');
        const forgotLink = document.getElementById('forgotPasswordLink');
        const signupLink = document.getElementById('signupLink');

        // Helper to show message (error or success)
        function setMessage(text, isError = true) {
            messageBox.innerHTML = text ? `<span>${text}</span>` : '';
            if (!text) {
                messageBox.className = 'message-area';
                return;
            }
            messageBox.className = `message-area ${isError ? 'error-msg' : 'success-msg'}`;
            // auto-clear success message after 3 seconds, but keep errors until next interaction
            if (!isError) {
                setTimeout(() => {
                    if (messageBox.innerHTML.includes(text)) {
                        messageBox.innerHTML = '';
                        messageBox.className = 'message-area';
                    }
                }, 3000);
            }
        }

        // Clear any previous message when typing (UX)
        function clearMessageOnInput() {
            setMessage('');
        }
        emailInput.addEventListener('input', clearMessageOnInput);
        passwordInput.addEventListener('input', clearMessageOnInput);

        // Toggle password visibility
        function togglePasswordVisibility() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            if (type === 'text') {
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            } else {
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            }
        }
        if (toggleBtn) {
            toggleBtn.addEventListener('click', togglePasswordVisibility);
        }

        // VALIDATION & DEMO CREDENTIALS (realistic front-end demo)
        // Demo accounts: "demo@example.com" / "password123" , "user@test.com" / "test123" , "admin@secure.com" / "admin123"
        function validateCredentials(email, password) {
            const trimmedEmail = email.trim().toLowerCase();
            const trimmedPass = password.trim();
            if ((trimmedEmail === 'demo@example.com' && trimmedPass === 'password123') ||
                (trimmedEmail === 'user@test.com' && trimmedPass === 'test123') ||
                (trimmedEmail === 'admin@secure.com' && trimmedPass === 'admin123')) {
                return true;
            }
            return false;
        }

        // store "remember me" in localStorage (demo)
        function loadRememberedEmail() {
            const remembered = localStorage.getItem('loginEmail');
            if (remembered) {
                emailInput.value = remembered;
                rememberCheck.checked = true;
            }
        }

        function handleRemember(email) {
            if (rememberCheck.checked) {
                localStorage.setItem('loginEmail', email.trim());
            } else {
                localStorage.removeItem('loginEmail');
            }
        }

        // process login with validation and demo auth
        function performLogin(event) {
            event.preventDefault();  // prevent actual submit

            const email = emailInput.value;
            const password = passwordInput.value;

            // Basic non-empty validation
            if (!email || !password) {
                setMessage('❌ Please enter both email and password.', true);
                return;
            }

            // Email format check (simple but robust)
            const emailPattern = /^[^\s@]+@([^\s@.,]+\.)+[^\s@.,]{2,}$/;
            if (!emailPattern.test(email)) {
                setMessage('⚠️ Enter a valid email address (e.g., name@domain.com).', true);
                return;
            }

            if (password.length < 4) {
                setMessage('🔒 Password must be at least 4 characters.', true);
                return;
            }

            // Authenticate against demo credentials
            const isValid = validateCredentials(email, password);
            if (isValid) {
                // successful login
                handleRemember(email);
                const userName = email.split('@')[0];
                setMessage(`🏠 Welcome back, ${userName}! You have successfully signed in.`, false);
                // change button temporarily for demo effect
                const loginBtn = document.getElementById('loginButton');
                const originalHtml = loginBtn.innerHTML;
                loginBtn.innerHTML = '<i class="fas fa-house-chimney"></i> Access granted';
                setTimeout(() => {
                    loginBtn.innerHTML = originalHtml;
                }, 1300);
                // No redirect, just demo — but you could redirect to dashboard.
            } else {
                setMessage('❌ Invalid email or password.', true);
                // subtle shake feedback
                emailInput.style.transform = 'translateX(4px)';
                passwordInput.style.transform = 'translateX(4px)';
                setTimeout(() => {
                    emailInput.style.transform = '';
                    passwordInput.style.transform = '';
                }, 200);
            }
        }

        // attach event to form submission
        loginForm.addEventListener('submit', performLogin);

        // Forgot password demo interaction
        forgotLink.addEventListener('click', (e) => {
            e.preventDefault();
            setMessage('📧 Demo: A password reset link would be sent to your email address.', false);
        });

        // Sign up demo
        signupLink.addEventListener('click', (e) => {
            e.preventDefault();
            setMessage('✨ Demo: Create a new account (registration form would open).', false);
        });

        // Load remembered email if exist
        loadRememberedEmail();

        // Email hint option has been completely removed (no automatic hint message)
    })();
</script>
</body>
</html>
