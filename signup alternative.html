<style>
:root {
    --bg-page:        #0f172a;
    --bg-card:        #111827;
    --bg-surface:     #1e293b;

    --charcoal:       #8b5cf6;
    --charcoal-hover: #7c3aed;

    --border:         #334155;
    --border-focus:   #a78bfa;

    --text-main:      #f8fafc;
    --text-muted:     #94a3b8;
    --text-label:     #cbd5e1;

    --gold:           #f59e0b;
    --red-accent:     #ef4444;
    --green-ok:       #22c55e;

    --radius-sm:      6px;
    --radius-md:      12px;

    --font-gothic:    'Cinzel', serif;
    --font-body:      'Inter', sans-serif;

    --shadow:         0 10px 35px rgba(0,0,0,0.45);
    --transition:     0.2s ease;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:var(--font-body);
    background:linear-gradient(135deg,#020617,#111827,#1e1b4b);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
    color:var(--text-main);
}

.signup-card{
    width:100%;
    max-width:520px;
    background:rgba(17,24,39,0.95);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:40px;
    box-shadow:var(--shadow);
    backdrop-filter:blur(10px);
}

.card-header{
    text-align:center;
    margin-bottom:28px;
}

.hotel-title{
    font-family:var(--font-gothic);
    font-size:1rem;
    letter-spacing:2px;
    color:var(--gold);
    margin-bottom:10px;
}

.page-title{
    font-size:2rem;
    font-weight:700;
    margin-bottom:8px;
}

.page-subtitle{
    color:var(--text-muted);
    font-size:0.9rem;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    font-size:0.8rem;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--text-label);
}

.input-wrap{
    position:relative;
}

.input-wrap i{
    position:absolute;
    top:50%;
    left:14px;
    transform:translateY(-50%);
    color:var(--text-muted);
}

.input-wrap input{
    width:100%;
    padding:14px 14px 14px 42px;
    border-radius:var(--radius-sm);
    border:1px solid var(--border);
    background:var(--bg-surface);
    color:var(--text-main);
    font-size:0.95rem;
    outline:none;
    transition:0.2s;
}

.input-wrap input:focus{
    border-color:var(--border-focus);
    box-shadow:0 0 0 4px rgba(139,92,246,0.15);
}

.btn-primary{
    width:100%;
    padding:14px;
    border:none;
    border-radius:var(--radius-sm);
    background:linear-gradient(135deg,#8b5cf6,#7c3aed);
    color:white;
    font-family:var(--font-gothic);
    letter-spacing:1px;
    font-size:0.85rem;
    cursor:pointer;
    transition:0.2s;
    margin-top:8px;
}

.btn-primary:hover{
    transform:translateY(-2px);
    background:linear-gradient(135deg,#7c3aed,#6d28d9);
}

.signin-prompt{
    text-align:center;
    margin-top:20px;
    color:var(--text-muted);
    font-size:0.85rem;
}

.signin-prompt a{
    color:var(--gold);
    text-decoration:none;
    font-weight:600;
}

.signin-prompt a:hover{
    text-decoration:underline;
}

@media(max-width:600px){
    .signup-card{
        padding:28px;
    }
}
</style>

</head>

<body>

<div class="signup-card">

```
<div class="card-header">
    <div class="hotel-title">🏰 HOTEL TRANSYLVANIA</div>
    <div class="page-title">Create Account</div>
    <div class="page-subtitle">Enter your details to join us</div>
</div>

<form>

    <div class="form-group">
        <label>First Name</label>
        <div class="input-wrap">
            <i class="fas fa-user"></i>
            <input type="text" placeholder="John">
        </div>
    </div>

    <div class="form-group">
        <label>Last Name</label>
        <div class="input-wrap">
            <i class="fas fa-user"></i>
            <input type="text" placeholder="Smith">
        </div>
    </div>

    <div class="form-group">
        <label>Email Address</label>
        <div class="input-wrap">
            <i class="fas fa-envelope"></i>
            <input type="email" placeholder="example@gmail.com">
        </div>
    </div>

    <div class="form-group">
        <label>Username</label>
        <div class="input-wrap">
            <i class="fas fa-at"></i>
            <input type="text" placeholder="Choose username">
        </div>
    </div>

    <div class="form-group">
        <label>Password</label>
        <div class="input-wrap">
            <i class="fas fa-lock"></i>
            <input type="password" placeholder="Create password">
        </div>
    </div>

    <button class="btn-primary">
        <i class="fas fa-user-plus"></i>
        Create Account
    </button>

</form>

<div class="signin-prompt">
    Already have an account?
    <a href="#">Sign In</a>
</div>
```

</div>
