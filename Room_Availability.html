<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Hotel Transylvania | Room Availability</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Cinzel+Decorative:wght@400;700;900&family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --bg-deep: #0d0a14;
            --bg-dark: #1a0f2e;
            --bg-card: #1e1335;
            --bg-card-hover: #281a45;
            --purple-mid: #3d2a5c;
            --purple-light: #5c3d85;
            --gold: #c8a84e;
            --gold-light: #e0c878;
            --gold-dark: #8b6914;
            --red-accent: #8b1a2b;
            --red-bright: #b81c36;
            --cream: #f0e6d3;
            --cream-dark: #d5c8b0;
            --text-light: #e8e0d5;
            --text-muted: #b0a595;
            --stone: #2a1f3a;
            --border-gold: rgba(200, 168, 78, 0.4);
            --shadow-gold: rgba(200, 168, 78, 0.25);
            --shadow-dark: rgba(0, 0, 0, 0.6);
            --font-gothic: 'Cinzel', 'Cinzel Decorative', serif;
            --font-body: 'Inter', 'Playfair Display', serif;
            --transition-smooth: 0.4s cubic-bezier(0.25, 0.8, 0.25, 1.2);
            --transition-fast: 0.25s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-light);
            font-family: var(--font-body);
            min-height: 100vh;
            padding: 2rem;
            position: relative;
            background-image: radial-gradient(ellipse at 20% 20%, rgba(100, 40, 120, 0.12) 0%, transparent 60%),
                              radial-gradient(ellipse at 80% 60%, rgba(180, 30, 50, 0.08) 0%, transparent 55%),
                              radial-gradient(ellipse at 50% 90%, rgba(200, 168, 78, 0.06) 0%, transparent 50%),
                              url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 5 L32 28 L30 30 L28 28 Z' fill='%23ffffff02'/%3E%3C/svg%3E");
            background-attachment: fixed;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { background: var(--purple-mid); border-radius: 4px; border: 1px solid var(--border-gold); }
        ::-webkit-scrollbar-thumb:hover { background: var(--purple-light); }

        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        /* Header with exact bat logo from original */
        .header {
            margin-bottom: 2rem;
            text-align: center;
        }

        .brand-icon {
            width: 70px;
            height: 70px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .nav-bat-svg {
            width: 60px;
            height: 60px;
            filter: drop-shadow(0 0 10px rgba(200, 168, 78, 0.5));
            animation: batFloat 3s ease-in-out infinite;
        }

        @keyframes batFloat {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .header h1 {
            font-family: var(--font-gothic);
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 3px;
            background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px rgba(200, 168, 78, 0.3);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 6px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .card {
            background: rgba(30, 19, 53, 0.75);
            backdrop-filter: blur(8px);
            border-radius: 1.5rem;
            box-shadow: 0 25px 45px -12px var(--shadow-dark), 0 4px 15px rgba(0, 0, 0, 0.3);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border-gold);
            transition: transform var(--transition-fast);
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 30px 50px -15px var(--shadow-dark), 0 0 0 1px rgba(200, 168, 78, 0.2);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .card-header h2 {
            font-family: var(--font-gothic);
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--gold-light);
            letter-spacing: 1px;
        }

        .badge {
            background: rgba(200, 168, 78, 0.15);
            padding: 0.3rem 0.9rem;
            border-radius: 2rem;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--gold);
            border: 1px solid var(--border-gold);
            letter-spacing: 0.5px;
        }

        .rooms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.2rem;
        }

        .room-card {
            background: var(--bg-card);
            border: 1px solid var(--border-gold);
            border-radius: 1.2rem;
            padding: 1rem;
            transition: all var(--transition-smooth);
            cursor: pointer;
        }

        .room-card:hover {
            transform: translateY(-6px);
            background: var(--bg-card-hover);
            border-color: var(--gold);
            box-shadow: 0 15px 30px -12px var(--shadow-dark), 0 0 20px var(--shadow-gold);
        }

        .room-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
            flex-wrap: wrap;
            gap: 8px;
        }

        .room-number {
            font-family: var(--font-gothic);
            font-weight: 800;
            font-size: 1.1rem;
            background: linear-gradient(135deg, var(--purple-mid), var(--bg-dark));
            color: var(--gold);
            padding: 0.2rem 0.8rem;
            border-radius: 2rem;
            border: 1px solid var(--border-gold);
            letter-spacing: 1px;
        }

        .room-type {
            font-family: var(--font-gothic);
            font-weight: 600;
            color: var(--cream);
            font-size: 0.9rem;
        }

        .status-badge {
            font-size: 0.65rem;
            padding: 0.25rem 0.7rem;
            border-radius: 2rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .status-available { background: #1e4620; color: #8bc34a; border: 1px solid #8bc34a; }
        .status-occupied { background: #4a1a2a; color: #ff8a8a; border: 1px solid #ff6b6b; }
        .status-maintenance { background: #4a3a1a; color: #ffd966; border: 1px solid #ffd966; }

        .room-details p {
            font-size: 0.75rem;
            margin: 0.4rem 0;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .room-details p i {
            width: 20px;
            color: var(--gold);
        }

        .filter-bar {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .filter-bar input, .filter-bar select {
            padding: 0.6rem 1rem;
            border: 1px solid var(--border-gold);
            border-radius: 2rem;
            font-family: var(--font-body);
            background: var(--bg-dark);
            color: var(--text-light);
            transition: all var(--transition-fast);
            outline: none;
        }

        .filter-bar input::placeholder {
            color: var(--text-muted);
        }

        .filter-bar input:focus, .filter-bar select:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(200, 168, 78, 0.2);
            background: var(--bg-card);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 1.8rem;
        }

        .stat-card {
            background: rgba(30, 19, 53, 0.7);
            backdrop-filter: blur(4px);
            border-radius: 1.2rem;
            padding: 1rem 1.2rem;
            box-shadow: 0 8px 18px var(--shadow-dark);
            border: 1px solid var(--border-gold);
            transition: all var(--transition-fast);
            text-align: center;
        }

        .stat-card:hover {
            border-color: var(--gold);
            transform: translateY(-2px);
        }

        .stat-title {
            font-family: var(--font-gothic);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--gold);
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--cream);
            font-family: var(--font-gothic);
        }

        @media (max-width: 700px) {
            body { padding: 1rem; }
            .header h1 { font-size: 1.6rem; }
            .nav-bat-svg { width: 45px; height: 45px; }
        }

        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            font-size: 1rem;
            animation: particleDrift linear infinite;
            opacity: 0.3;
        }
        @keyframes particleDrift {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.4; }
            90% { opacity: 0.4; }
            100% { transform: translateY(-120px) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

<div id="particles-container"></div>

<div class="dashboard-container">
    <div class="header">
        <div class="brand-icon">
            <svg class="nav-bat-svg" viewBox="0 0 60 60">
                <defs><radialGradient id="batGlow" cx="50%" cy="40%" r="50%"><stop offset="0%" stop-color="#e0c878" stop-opacity="1"/><stop offset="100%" stop-color="#8b6914" stop-opacity="0.6"/></radialGradient></defs>
                <ellipse cx="30" cy="32" rx="8" ry="10" fill="url(#batGlow)"/>
                <circle cx="30" cy="22" r="6" fill="#c8a84e"/>
                <polygon points="26,18 22,10 28,17" fill="#c8a84e"/>
                <polygon points="34,18 38,10 32,17" fill="#c8a84e"/>
                <circle cx="27" cy="21" r="1.5" fill="#1a0f2e"/>
                <circle cx="33" cy="21" r="1.5" fill="#1a0f2e"/>
                <path d="M22,28 Q8,15 6,30 Q10,28 14,32 Q10,35 8,44 Q16,32 22,36 Z" fill="#8b6914" opacity="0.9"/>
                <path d="M38,28 Q52,15 54,30 Q50,28 46,32 Q50,35 52,44 Q44,32 38,36 Z" fill="#8b6914" opacity="0.9"/>
                <polygon points="28,26 29,32 27,32" fill="#fff" opacity="0.8"/>
                <polygon points="32,26 33,32 31,32" fill="#fff" opacity="0.8"/>
            </svg>
        </div>
        <h1>HOTEL TRANSYLVANIA</h1>
        <div class="subtitle">Chamber Availability · Real-time status & occupancy</div>
    </div>

    <div class="card">
        <div class="card-header">
            <h2><i class="fas fa-door-open"></i> Royal Chamber Status</h2>
            <div class="badge"><i class="fas fa-sync-alt"></i> Live availability (max 10 rooms)</div>
        </div>
        <div class="filter-bar">
            <input type="text" id="roomSearch" placeholder="Filter by room number or type..." style="flex:1">
            <select id="roomStatusFilter">
                <option value="all">All statuses</option>
                <option value="Available">Available</option>
                <option value="Occupied">Occupied</option>
                <option value="Under Maintenance">Maintenance</option>
            </select>
        </div>
        <div id="roomsContainer" class="rooms-grid"></div>
    </div>
    <div class="stats-grid" id="roomStats"></div>
</div>

<script>
    const roomsData = [
        { roomId: 1, roomNumber: "001", type: "Single", pricePerNight: 950, maxOccupancy: 1, status: "Available", amenities: "Wi-Fi, AC", rating: 4.2 },
        { roomId: 2, roomNumber: "002", type: "Double", pricePerNight: 1450, maxOccupancy: 2, status: "Occupied", amenities: "Wi-Fi, Breakfast", rating: 4.5 },
        { roomId: 3, roomNumber: "003", type: "Twin", pricePerNight: 1350, maxOccupancy: 2, status: "Available", amenities: "City view", rating: 4.3 },
        { roomId: 4, roomNumber: "004", type: "Family", pricePerNight: 2200, maxOccupancy: 4, status: "Available", amenities: "Extra space", rating: 4.7 },
        { roomId: 5, roomNumber: "005", type: "Double", pricePerNight: 1480, maxOccupancy: 2, status: "Under Maintenance", amenities: "Balcony", rating: 4.0 },
        { roomId: 6, roomNumber: "006", type: "Single", pricePerNight: 920, maxOccupancy: 1, status: "Available", amenities: "Garden view", rating: 4.1 },
        { roomId: 7, roomNumber: "007", type: "Family", pricePerNight: 2350, maxOccupancy: 4, status: "Occupied", amenities: "Kitchenette", rating: 4.8 },
        { roomId: 8, roomNumber: "008", type: "Twin", pricePerNight: 1300, maxOccupancy: 2, status: "Available", amenities: "Soundproof", rating: 4.4 },
        { roomId: 9, roomNumber: "009", type: "Double", pricePerNight: 1500, maxOccupancy: 2, status: "Available", amenities: "Sea view", rating: 4.6 },
        { roomId: 10, roomNumber: "010", type: "Single", pricePerNight: 880, maxOccupancy: 1, status: "Occupied", amenities: "Compact", rating: 3.9 }
    ];

    function updateRoomDisplay() {
        const searchTerm = document.getElementById('roomSearch').value.toLowerCase();
        const statusFilter = document.getElementById('roomStatusFilter').value;
        
        let filtered = roomsData.filter(room => {
            const matchSearch = room.roomNumber.includes(searchTerm) || room.type.toLowerCase().includes(searchTerm);
            const matchStatus = statusFilter === 'all' || room.status === statusFilter;
            return matchSearch && matchStatus;
        });

        const container = document.getElementById('roomsContainer');
        container.innerHTML = filtered.map(room => `
            <div class="room-card">
                <div class="room-header">
                    <span class="room-number">${room.roomNumber}</span>
                    <span class="room-type">${room.type}</span>
                    <span class="status-badge status-${room.status === 'Available' ? 'available' : (room.status === 'Occupied' ? 'occupied' : 'maintenance')}">${room.status}</span>
                </div>
                <div class="room-details">
                    <p><i class="fas fa-user-friends"></i> Max ${room.maxOccupancy} guests</p>
                    <p><i class="fas fa-coins"></i> ZAR ${room.pricePerNight} / night</p>
                    <p><i class="fas fa-wifi"></i> ${room.amenities}</p>
                    <p><i class="fas fa-star"></i> Rating: ${room.rating}/5</p>
                </div>
            </div>
        `).join('');

        const totalRooms = roomsData.length;
        const available = roomsData.filter(r => r.status === 'Available').length;
        const occupied = roomsData.filter(r => r.status === 'Occupied').length;
        const maintenance = roomsData.filter(r => r.status === 'Under Maintenance').length;
        
        document.getElementById('roomStats').innerHTML = `
            <div class="stat-card"><div class="stat-title">Total Chambers</div><div class="stat-value">${totalRooms}/10</div></div>
            <div class="stat-card"><div class="stat-title">Available</div><div class="stat-value">${available}</div></div>
            <div class="stat-card"><div class="stat-title">Occupied</div><div class="stat-value">${occupied}</div></div>
            <div class="stat-card"><div class="stat-title">Maintenance</div><div class="stat-value">${maintenance}</div></div>
        `;
    }

    function bindEvents() {
        document.getElementById('roomSearch').addEventListener('input', updateRoomDisplay);
        document.getElementById('roomStatusFilter').addEventListener('change', updateRoomDisplay);
    }

    function createParticles() {
        const container = document.getElementById('particles-container');
        if (!container) return;
        const emojis = ['🦇', '✨', '🕯️', '🌙', '💫', '🕸️', '👻', '🖤', '⚜️', '🏰'];
        for (let i = 0; i < 20; i++) {
            const particle = document.createElement('span');
            particle.className = 'particle';
            particle.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDuration = (10 + Math.random() * 25) + 's';
            particle.style.animationDelay = Math.random() * 15 + 's';
            particle.style.fontSize = (0.7 + Math.random() * 1.5) + 'rem';
            particle.style.opacity = (0.1 + Math.random() * 0.3);
            container.appendChild(particle);
        }
    }

    function init() {
        updateRoomDisplay();
        bindEvents();
        createParticles();
    }

    init();
</script>
</body>
</html>
