<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Hotel Transylvania | Available Rooms</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Cinzel+Decorative:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-logo-section" onclick="window.location.href='index.html'">
            <div class="nav-logo-icon">
                🦇
            </div>
            <span class="nav-logo-text">
                HOTEL TRANSYLVANIA
            </span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="rooms.html">Rooms</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
        </ul>
        <button class="btn-signin" id="userBtn" onclick="handleUserBtn()">
            SIGN IN
        </button>
    </nav>

    <!-- PAGE -->
    <section class="page-section">

        <div class="page-header">
            <p class="page-subtitle">
                ✦ Our Accommodations ✦
            </p>

            <h1 class="page-title">
                AVAILABLE ROOMS
            </h1>

            <p class="page-description">
                Explore our luxurious collection of rooms and suites.
            </p>
        </div>

        <!-- ROOMS GRID -->
        <div class="rooms-grid" id="roomsContainer">
            <p style="text-align:center;">Loading rooms...</p>
        </div>

    </section>

    <script src="../assets/js/api.js"></script>
    <script>

        // Check if user is logged in
        function checkLoginStatus() {
            const token = localStorage.getItem("authToken");
            const userData = JSON.parse(localStorage.getItem("userData"));
            const btn = document.getElementById("userBtn");

            if (token && userData) {
                btn.textContent = `👤 ${userData.name.split(' ')[0]}`;
                btn.onclick = logout;
            } else {
                btn.textContent = "SIGN IN";
                btn.onclick = () => window.location.href = "login.html";
            }
        }

        function handleUserBtn() {
            const token = localStorage.getItem("authToken");
            if (token) {
                logout();
            } else {
                window.location.href = "login.html";
            }
        }

        function logout() {
            localStorage.removeItem("authToken");
            localStorage.removeItem("userRole");
            localStorage.removeItem("userData");
            window.location.href = "index.html";
        }

        async function loadRooms() {
            try {
                const rooms = await apiRequest('/rooms');
                const container = document.getElementById("roomsContainer");
                container.innerHTML = "";

                if (!rooms || rooms.length === 0) {
                    container.innerHTML = `
                        <div style="grid-column: 1 / -1; text-align: center; padding: 40px;">
                            <p>No rooms available at the moment.</p>
                        </div>
                    `;
                    return;
                }

                rooms.forEach(room => {
                    const roomCard = document.createElement("div");
                    roomCard.className = "room-card";
                    roomCard.innerHTML = `
                        <div class="room-image">
                            <span class="room-icon">${getRoomIcon(room.room_type)}</span>
                        </div>
                        <div class="room-info">
                            <h3>${room.room_type}</h3>
                            <p class="room-description">${room.description || 'Comfortable and well-appointed room'}</p>
                            <div class="room-details">
                                <span>💰 R${room.price_per_night}/night</span>
                                <span>👥 ${room.capacity} guest${room.capacity > 1 ? 's' : ''}</span>
                            </div>
                            <button class="btn-book" onclick="bookRoom('${room.room_id}', '${room.room_type}')">
                                Book Now
                            </button>
                        </div>
                    `;
                    container.appendChild(roomCard);
                });

            } catch (error) {
                console.error(error);
                document.getElementById("roomsContainer").innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 40px;">
                        <p>Failed to load rooms. Please try again later.</p>
                    </div>
                `;
            }
        }

        function getRoomIcon(roomType) {
            const icons = {
                'SINGLE': '🪑',
                'DOUBLE': '🛏️',
                'TWIN': '🛏️🛏️',
                'ENSUITE': '🛁',
                'FAMILY': '👨‍👩‍👧‍👦',
                'PRESIDENTIAL': '👑'
            };
            return icons[roomType] || '🏨';
        }

        function bookRoom(roomId, roomType) {
            const token = localStorage.getItem("authToken");
            if (!token) {
                alert("Please sign in to book a room.");
                window.location.href = "login.html";
                return;
            }
            // Redirect to booking page with room details
            window.location.href = `booking.html?roomId=${roomId}&roomType=${encodeURIComponent(roomType)}`;
        }

        checkLoginStatus();
        loadRooms();

        // Refresh rooms every 30 seconds
        setInterval(loadRooms, 30000);

    </script>

</body>
</html>
