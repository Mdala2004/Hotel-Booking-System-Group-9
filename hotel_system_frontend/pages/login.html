<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Hotel Transylvania | Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Cinzel+Decorative:wght@400;700;900&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --bg-deep: #0d0a14;
            --bg-dark: #1a0f2e;
            --bg-card: #1e1335;
            --bg-card-hover: #281a45;
            --purple-mid: #3d2a5c;
            --purple-light: #5c3d85;
            --gold: #c8a84e;
            --gold-light: #e0c878;
            --gold-dark: #8b6914;
            --red-accent: #8b1a2b;
            --red-bright: #b81c36;
            --cream: #f0e6d3;
            --cream-dark: #d5c8b0;
            --text-light: #e8e0d5;
            --text-muted: #b0a595;
            --border-gold: rgba(200, 168, 78, 0.4);
            --shadow-gold: rgba(200, 168, 78, 0.25);
            --shadow-dark: rgba(0, 0, 0, 0.6);
            --font-gothic: 'Cinzel', 'Cinzel Decorative', serif;
            --font-body: 'Inter', 'Playfair Display', serif;
            --transition-smooth: 0.4s cubic-bezier(0.25, 0.8, 0.25, 1.2);
            --transition-fast: 0.25s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-deep);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 100px 1.5rem 2rem;
            overflow-x: hidden;
            background-image:
                radial-gradient(ellipse at 20% 20%, rgba(100, 40, 120, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 60%, rgba(180, 30, 50, 0.10) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 90%, rgba(200, 168, 78, 0.07) 0%, transparent 50%);
            background-attachment: fixed;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { background: var(--purple-mid); border-radius: 4px; border: 1px solid var(--border-gold); }

        /* ── NAVBAR ── */
        .navbar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 40px;
            background: linear-gradient(180deg, rgba(13,10,20,0.97) 60%, rgba(13,10,20,0.7) 100%);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-gold);
            min-height: 70px;
        }
        .nav-logo-section { display: flex; align-items: center; gap: 14px; cursor: pointer; }
        .nav-bat-svg { width: 44px; height: 44px; filter: drop-shadow(0 0 10px rgba(200,168,78,0.5)); animation: batFloat 3s ease-in-out infinite; }
        @keyframes batFloat { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }
        .nav-logo-text { font-family: var(--font-gothic); font-size: 1.25rem; font-weight: 700; color: var(--gold); letter-spacing: 1.5px; text-shadow: 0 0 20px var(--shadow-gold); }
        .nav-links { display: flex; align-items: center; gap: 30px; list-style: none; }
        .nav-links a { font-family: var(--font-gothic); font-size: 0.9rem; color: var(--cream-dark); text-decoration: none; letter-spacing: 1.2px; position: relative; padding: 6px 0; transition: color var(--transition-fast); cursor: pointer; }
        .nav-links a::after { content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 2px; background: var(--gold); transition: width var(--transition-fast); }
        .nav-links a:hover { color: var(--gold-light); }
        .nav-links a:hover::after { width: 100%; }
        .btn-back-home { font-family: var(--font-gothic); font-size: 0.85rem; font-weight: 600; letter-spacing: 1px; padding: 10px 22px; background: transparent; color: var(--gold); border: 1.5px solid var(--gold); border-radius: 4px; cursor: pointer; transition: all var(--transition-fast); text-decoration: none; }
        .btn-back-home:hover { background: var(--gold); color: var(--bg-deep); box-shadow: 0 0 25px var(--shadow-gold); }
        @media (max-width: 768px) { .navbar { padding: 10px 20px; } .nav-links { display: none; } }

        /* ── PARTICLES ── */
        .particle { position: fixed; pointer-events: none; z-index: 0; animation: particleDrift linear infinite; }
        @keyframes particleDrift { 0%{transform:translateY(100vh) rotate(0deg);opacity:0;} 10%{opacity:0.35;} 90%{opacity:0.35;} 100%{transform:translateY(-120px) rotate(360deg);opacity:0;} }

        /* ── WRAPPER ── */
        .login-wrapper { position: relative; z-index: 2; width: 100%; max-width: 480px; }

        /* ── CARD ── */
        .login-card {
            background: var(--bg-card);
            border: 1.5px solid var(--border-gold);
            border-radius: 12px;
            box-shadow: 0 30px 80px var(--shadow-dark), 0 0 60px rgba(200,168,78,0.1);
            padding: 2.5rem 2.2rem 2.2rem;
            animation: cardReveal 0.6s cubic-bezier(0.25, 0.8, 0.25, 1.2);
            position: relative; overflow: hidden;
            transition: transform var(--transition-fast);
        }
        .login-card::before {
            content: ''; position: absolute; top: -60%; left: -30%;
            width: 160%; height: 160%;
            background: radial-gradient(circle at center, rgba(200,168,78,0.04) 0%, transparent 70%);
            pointer-events: none;
        }
        @keyframes cardReveal { from{opacity:0;transform:translateY(-30px) scale(0.96);} to{opacity:1;transform:translateY(0) scale(1);} }

        /* ── DECORATIVE CORNERS ── */
        .corner-deco { position: absolute; width: 50px; height: 50px; border-color: var(--border-gold); border-style: solid; opacity: 0.6; }
        .corner-deco.tl { top: 10px; left: 10px; border-width: 2px 0 0 2px; }
        .corner-deco.tr { top: 10px; right: 10px; border-width: 2px 2px 0 0; }
        .corner-deco.bl { bottom: 10px; left: 10px; border-width: 0 0 2px 2px; }
        .corner-deco.br { bottom: 10px; right: 10px; border-width: 0 2px 2px 0; }

        /* ── BRAND ── */
        .brand { text-align: center; margin-bottom: 1.8rem; }
        .brand-bat {
            display: inline-flex; align-items: center; justify-content: center;
            width: 72px; height: 72px;
            background: radial-gradient(circle, rgba(200,168,78,0.12) 0%, transparent 70%);
            border: 1px solid var(--border-gold); border-radius: 50%;
            margin-bottom: 1rem;
            box-shadow: 0 0 30px var(--shadow-gold);
        }
        .brand-bat svg { width: 48px; height: 48px; filter: drop-shadow(0 0 8px rgba(200,168,78,0.6)); animation: batFloat 3s ease-in-out infinite; }
        .brand h1 { font-family: var(--font-gothic); font-size: 1.55rem; font-weight: 700; color: var(--gold); letter-spacing: 2px; text-shadow: 0 0 20px var(--shadow-gold); margin-bottom: 6px; }
        .brand p { font-size: 0.85rem; color: var(--text-muted); letter-spacing: 0.5px; }

        /* ── ROLE TABS ── */
        .role-tabs { display: flex; background: var(--bg-deep); border: 1px solid var(--border-gold); border-radius: 6px; margin-bottom: 1.8rem; overflow: hidden; }
        .role-tab { flex: 1; padding: 10px; font-family: var(--font-gothic); font-size: 0.75rem; font-weight: 600; letter-spacing: 1.5px; color: var(--text-muted); background: transparent; border: none; cursor: pointer; transition: all var(--transition-fast); text-transform: uppercase; }
        .role-tab.active { background: var(--purple-mid); color: var(--gold-light); box-shadow: inset 0 0 20px rgba(200,168,78,0.1); }
        .role-tab:hover:not(.active) { color: var(--cream); background: rgba(255,255,255,0.04); }

        /* ── INPUTS ── */
        .login-form { display: flex; flex-direction: column; gap: 1.1rem; }
        .input-group { position: relative; }
        .input-group i.icon-left { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--gold-dark); font-size: 1rem; pointer-events: none; transition: color var(--transition-fast); }
        .input-group:focus-within i.icon-left { color: var(--gold); }
        .input-group input { width: 100%; padding: 0.85rem 1rem 0.85rem 2.7rem; font-size: 0.95rem; font-family: var(--font-body); background: var(--bg-deep); border: 1.5px solid rgba(200,168,78,0.25); border-radius: 6px; color: var(--text-light); outline: none; transition: all var(--transition-fast); }
        .input-group input::placeholder { color: var(--text-muted); }
        .input-group input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(200,168,78,0.12), 0 0 20px rgba(200,168,78,0.08); background: var(--bg-dark); }
        .toggle-password { position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1rem; padding: 0; transition: color var(--transition-fast); }
        .toggle-password:hover { color: var(--gold); }

        /* ── OPTIONS ROW ── */
        .flex-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
        .checkbox-label { display: flex; align-items: center; gap: 0.5rem; cursor: pointer; font-size: 0.82rem; color: var(--text-muted); }
        .checkbox-label input { width: 1rem; height: 1rem; accent-color: var(--gold); cursor: pointer; }
        .forgot-link { font-size: 0.82rem; font-weight: 600; color: var(--gold); text-decoration: none; transition: color var(--transition-fast); letter-spacing: 0.5px; }
        .forgot-link:hover { color: var(--gold-light); text-decoration: underline; }

        /* ── BUTTON ── */
        .login-btn { width: 100%; padding: 0.9rem; font-family: var(--font-gothic); font-size: 0.9rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; background: var(--red-accent); color: #fff; border: none; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.6rem; transition: all var(--transition-fast); box-shadow: 0 8px 20px rgba(139,26,43,0.4); margin-top: 0.3rem; }
        .login-btn:hover { background: var(--red-bright); box-shadow: 0 0 30px rgba(184,28,54,0.6); transform: translateY(-2px); }
        .login-btn:active { transform: translateY(0); }
        .login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        /* ── DIVIDER ── */
        .divider { display: flex; align-items: center; gap: 1rem; margin: 0.2rem 0; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border-gold); }
        .divider span { font-family: var(--font-gothic); font-size: 0.7rem; color: var(--text-muted); letter-spacing: 2px; }

        /* ── SIGNUP ── */
        .signup-prompt { text-align: center; font-size: 0.83rem; color: var(--text-muted); }
        .signup-prompt a { color: var(--gold); font-weight: 600; text-decoration: none; letter-spacing: 0.5px; transition: color var(--transition-fast); }
        .signup-prompt a:hover { color: var(--gold-light); text-decoration: underline; }

        /* ── MESSAGES ── */
        .message-area { text-align: center; font-size: 0.82rem; font-weight: 500; min-height: 1.5rem; border-radius: 6px; transition: all 0.2s; letter-spacing: 0.3px; }
        .error-msg { color: #ff6b6b; background: rgba(139,26,43,0.2); border: 1px solid rgba(139,26,43,0.4); padding: 0.5rem; }
        .success-msg { color: #4caf84; background: rgba(45,106,63,0.2); border: 1px solid rgba(45,106,63,0.4); padding: 0.5rem; }

        /* ── TOAST ── */
        .toast { position: fixed; bottom: 30px; right: 30px; z-index: 3000; padding: 14px 22px; border-radius: 6px; font-family: var(--font-gothic); font-size: 0.85rem; font-weight: 600; letter-spacing: 1px; color: #fff; animation: toastIn 0.4s ease, toastOut 0.4s ease 2.6s forwards; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .toast.success { background: #2d6a3f; border: 1px solid #4caf84; }
        .toast.error   { background: #8b1a2b; border: 1px solid #c0392b; }
        .toast.info    { background: #3d2a5c; border: 1px solid var(--gold); }
        @keyframes toastIn  { from{opacity:0;transform:translateX(60px);} to{opacity:1;transform:translateX(0);} }
        @keyframes toastOut { from{opacity:1;} to{opacity:0;transform:translateX(60px);} }

        @media (max-width: 500px) { .login-card { padding: 2rem 1.4rem; } .brand h1 { font-size: 1.3rem; } }
    </style>
</head>
<body>

    <div id="particles-container"></div>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-logo-section" onclick="window.location.href='../index.html'">
            <svg class="nav-bat-svg" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
                <defs><radialGradient id="batGlow" cx="50%" cy="40%" r="50%"><stop offset="0%" stop-color="#e0c878"/><stop offset="100%" stop-color="#8b6914" stop-opacity="0.6"/></radialGradient></defs>
                <ellipse cx="30" cy="32" rx="8" ry="10" fill="url(#batGlow)"/>
                <circle cx="30" cy="22" r="6" fill="#c8a84e"/>
                <polygon points="26,18 22,10 28,17" fill="#c8a84e"/>
                <polygon points="34,18 38,10 32,17" fill="#c8a84e"/>
                <circle cx="27" cy="21" r="1.5" fill="#1a0f2e"/>
                <circle cx="33" cy="21" r="1.5" fill="#1a0f2e"/>
                <path d="M22,28 Q8,15 6,30 Q10,28 14,32 Q10,35 8,44 Q16,32 22,36 Z" fill="#8b6914" opacity="0.9"/>
                <path d="M38,28 Q52,15 54,30 Q50,28 46,32 Q50,35 52,44 Q44,32 38,36 Z" fill="#8b6914" opacity="0.9"/>
                <polygon points="28,26 29,32 27,32" fill="#fff" opacity="0.8"/>
                <polygon points="32,26 33,32 31,32" fill="#fff" opacity="0.8"/>
            </svg>
            <span class="nav-logo-text">HOTEL TRANSYLVANIA</span>
        </div>
        <ul class="nav-links">
            <li><a href="../index.html">Home</a></li>
            <li><a href="rooms.html">Rooms</a></li>
            <li><a href="rooms.html">Book Now</a></li>
        </ul>
        <a href="../index.html" class="btn-back-home">← Back Home</a>
    </nav>

    <!-- Login Card -->
    <div class="login-wrapper">
        <div class="login-card">
            <div class="corner-deco tl"></div>
            <div class="corner-deco tr"></div>
            <div class="corner-deco bl"></div>
            <div class="corner-deco br"></div>

            <!-- Brand -->
            <div class="brand">
                <div class="brand-bat">
                    <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
                        <defs><radialGradient id="batGlow2" cx="50%" cy="40%" r="50%"><stop offset="0%" stop-color="#e0c878"/><stop offset="100%" stop-color="#8b6914" stop-opacity="0.6"/></radialGradient></defs>
                        <ellipse cx="30" cy="32" rx="8" ry="10" fill="url(#batGlow2)"/>
                        <circle cx="30" cy="22" r="6" fill="#c8a84e"/>
                        <polygon points="26,18 22,10 28,17" fill="#c8a84e"/>
                        <polygon points="34,18 38,10 32,17" fill="#c8a84e"/>
                        <circle cx="27" cy="21" r="1.5" fill="#1a0f2e"/>
                        <circle cx="33" cy="21" r="1.5" fill="#1a0f2e"/>
                        <path d="M22,28 Q8,15 6,30 Q10,28 14,32 Q10,35 8,44 Q16,32 22,36 Z" fill="#8b6914" opacity="0.9"/>
                        <path d="M38,28 Q52,15 54,30 Q50,28 46,32 Q50,35 52,44 Q44,32 38,36 Z" fill="#8b6914" opacity="0.9"/>
                    </svg>
                </div>
                <h1>HOTEL TRANSYLVANIA</h1>
                <p>Sign in to continue your stay</p>
            </div>

            <!-- Role Tabs -->
            <div class="role-tabs">
                <button class="role-tab active" id="tabGuest" onclick="switchRole('guest')">🧛 Guest</button>
                <button class="role-tab" id="tabStaff" onclick="switchRole('staff')">🏨 Staff</button>
            </div>

            <!-- Form -->
            <form class="login-form" id="loginForm" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <i class="fas fa-user icon-left"></i>
                    <input type="text" id="usernameInput" placeholder="Username" autocomplete="username" required>
                </div>

                <div class="input-group">
                    <i class="fas fa-key icon-left"></i>
                    <input type="password" id="passwordInput" placeholder="Password" autocomplete="current-password" required>
                    <button type="button" class="toggle-password" aria-label="Toggle password">
                        <i class="far fa-eye-slash" id="toggleIcon"></i>
                    </button>
                </div>

                <div class="flex-row">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberCheckbox"> Remember me
                    </label>
                    <a href="#" class="forgot-link" id="forgotLink">Forgot password?</a>
                </div>

                <button type="submit" class="login-btn" id="loginButton">
                    <i class="fas fa-arrow-right-to-bracket"></i> Sign In
                </button>

                <div class="divider"><span>✦</span></div>

                <div class="signup-prompt">
                    Don't have an account? <a href="register.html">Create account</a>
                </div>

                <div id="formMessage" class="message-area"></div>
            </form>
        </div>
    </div>

    <div id="toastContainer"></div>

    <!-- Replace this with your actual api.js path when integrating -->
    <!-- <script src="../assets/js/api.js"></script> -->

    <script src="../assets/js/api.js"></script>
    <script>
        let currentRole = 'guest';

        //PARTICLES
        (function() {
            const container = document.getElementById('particles-container');
            const emojis = ['🦇','✨','🕯️','🌙','💫','🕸️'];
            for (let i = 0; i < 14; i++) {
                const p = document.createElement('span');
                p.className = 'particle';
                p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (10 + Math.random() * 18) + 's';
                p.style.animationDelay = Math.random() * 15 + 's';
                p.style.fontSize = (0.7 + Math.random() * 1.4) + 'rem';
                p.style.opacity = (0.1 + Math.random() * 0.25);
                container.appendChild(p);
            }
        })();

        // ROLE SWITCH
        function switchRole(role) {
            currentRole = role;
            document.getElementById('tabGuest').classList.toggle('active', role === 'guest');
            document.getElementById('tabStaff').classList.toggle('active', role === 'staff');
            document.getElementById('usernameInput').placeholder = role === 'guest' ? 'Username' : 'Staff email';
            setMessage('');
        }

        // PASSWORD TOGGLE
        document.querySelector('.toggle-password').addEventListener('click', () => {
            const input = document.getElementById('passwordInput');
            const icon  = document.getElementById('toggleIcon');
            const isPassword = input.type === 'password';
            input.type = isPassword ? 'text' : 'password';
            icon.classList.toggle('fa-eye-slash', !isPassword);
            icon.classList.toggle('fa-eye', isPassword);
        });

        // MESSAGES 
        function setMessage(text, isError = true) {
            const box = document.getElementById('formMessage');
            if (!text) { box.className = 'message-area'; box.innerHTML = ''; return; }
            box.className = `message-area ${isError ? 'error-msg' : 'success-msg'}`;
            box.innerHTML = `<span>${text}</span>`;
            if (!isError) setTimeout(() => { box.innerHTML = ''; box.className = 'message-area'; }, 3000);
        }

        ['usernameInput','passwordInput'].forEach(id =>
            document.getElementById(id).addEventListener('input', () => setMessage(''))
        );

        // REMEMBER ME
        (function() {
            const saved = localStorage.getItem('rememberedUsername');
            if (saved) {
                document.getElementById('usernameInput').value = saved;
                document.getElementById('rememberCheckbox').checked = true;
            }
        })();

        // TOAST 
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => { if (toast.parentNode) toast.remove(); }, 3200);
        }

        // LOGIN
        async function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value;
            const remember = document.getElementById('rememberCheckbox').checked;

            if (!username || !password) {
                setMessage('❌ Please fill in all fields.', true);
                return;
            }

            const btn = document.getElementById('loginButton');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
            setMessage('');

            const endpoint = currentRole === 'guest'
                ? '/auth/login'
                : '/auth/staff-login';

            try {
                const data = await apiRequest(endpoint, {
                    method: 'POST',
                    body: JSON.stringify({ username, password })
                });

                if (data.token) {
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('userRole', currentRole);

                    if (currentRole === 'guest') {
                        localStorage.setItem('userData', JSON.stringify({
                            id:    data.guest.id,
                            name:  data.guest.name,
                            email: data.guest.email,
                            role:  'guest'
                        }));
                    } else {
                        localStorage.setItem('userData', JSON.stringify({ ...data.staff, role: 'staff' }));
                    }

                    if (remember) {
                        localStorage.setItem('rememberedUsername', username);
                    } else {
                        localStorage.removeItem('rememberedUsername');
                    }

                    setMessage('✦ Welcome back! Redirecting...', false);
                    showToast('Login successful!', 'success');

                    setTimeout(() => {
                        window.location.href = currentRole === 'staff'
                            ? 'admin/admin-dashboard.html'
                            : 'dashboard.html';
                    }, 1000);

                } else {
                    setMessage(`❌ ${data.error || 'Invalid credentials.'}`, true);
                    const card = document.querySelector('.login-card');
                    card.style.transform = 'translateX(6px)';
                    setTimeout(() => card.style.transform = '', 200);
                }

            } catch (err) {
                console.warn('Backend unreachable:', err.message);
                setMessage('⚠️ Could not reach the server. Check your connection.', true);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Sign In';
            }
        }

        // FORGOT PASSWORD 
        document.getElementById('forgotLink').addEventListener('click', (e) => {
            e.preventDefault();
            setMessage('📧 Please contact the front desk to reset your password.', false);
        });

        // REDIRECT IF ALREADY LOGGED IN 
        (function() {
            const token = localStorage.getItem('authToken');
            const role  = localStorage.getItem('userRole');
            if (token) {
                window.location.href = role === 'staff'
